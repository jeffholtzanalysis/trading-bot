name: Daily paper trade

# Runs the bot once per weekday during market hours against your Alpaca PAPER account,
# then commits trade_log.csv back to the repo so you build up a history.
#
# Off until you add these repo secrets (Settings > Secrets and variables > Actions):
#   ALPACA_API_KEY, ALPACA_SECRET_KEY, and optionally ANTHROPIC_API_KEY
# To pause it: Actions tab > "Daily paper trade" > "..." > Disable workflow.

on:
  schedule:
    - cron: "30 19 * * 1-5" # 19:30 UTC = 2:30 PM Central (summer) / 1:30 PM (winter)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip if keys are not set
        id: check
        run: |
          if [ -z "$ALPACA_API_KEY" ]; then
            echo "No ALPACA_API_KEY secret yet, skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.check.outputs.run == 'true'
        with:
          python-version: "3.11"
      - if: steps.check.outputs.run == 'true'
        run: pip install -r requirements.txt
      - if: steps.check.outputs.run == 'true'
        run: python trading_bot.py trade
      - name: Save trade log
        if: steps.check.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trade_log.csv
          git diff --cached --quiet || git commit -m "Paper trade log $(date -u +%F)"
          git push
